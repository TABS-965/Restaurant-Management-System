{% extends 'base.html' %}
{% block content %}
    <h2>Admin Panel</h2>
    <p><strong>Total Orders:</strong> {{ total_orders }}</p>
    <p><strong>Occupied Tables:</strong> {{ occupied_tables }}</p>
    <p><strong>Low Stock Items:</strong> {{ low_stock_items }}</p>
    <a href="{{ url_for('menu_manage') }}" class="button"><i class="fas fa-utensils icon"></i>Manage Menu</a>
    <a href="{{ url_for('inventory') }}" class="button"><i class="fas fa-warehouse icon"></i>Manage Inventory</a>
    <a href="{{ url_for('reports') }}" class="button"><i class="fas fa-chart-bar icon"></i>View Reports</a>
{% endblock %}
